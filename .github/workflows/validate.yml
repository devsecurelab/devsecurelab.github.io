name: Validate DevSecure Lab
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node --check assets/js/audio.js
      - run: node --check assets/js/progress.js
      - run: node --check assets/js/quiz.js
      - run: python - <<'PY'
        from pathlib import Path
        pages=list(Path('.').glob('*.html'))
        required=['index.html','linux.html','networking.html','python.html','web-security.html','ethical-hacking.html','english-for-cybersecurity.html','privacy.html','responsible-use.html','terms.html','404.html']
        assert all(Path(x).exists() for x in required)
        for p in pages:
          s=p.read_text()
          assert '<title>' in s and 'meta name="description"' in s and 'og:title' in s
        for p in required[1:7]: assert p in [x.name for x in pages]
        print(f'Validated {len(pages)} HTML pages')
        PY
